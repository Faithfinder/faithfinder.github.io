# User site for projects.dkartashev.dev (repo Faithfinder/faithfinder.github.io).
# Because this user site has a custom domain, GitHub serves every project site of
# this account under it at /<repo>/ and redirects the old faithfinder.github.io URLs.
# The bare dkartashev.dev is deliberately not used here: it's reserved for a
# personal site / ATProto (the Bluesky handle lives in its _atproto TXT record).
#
# index.html is the home page, written as plain HTML. The Atlassian apps' public pages
# (docs, privacy policy, terms and support, which their Marketplace listings link to)
# are Markdown in repo-starter/ and business-days/, rendered with _layouts/default.html.
# Everything shares assets/site.css.
title: Dmitrii Kartashev, projects
description: Atlassian apps by Dmitrii Kartashev.

# Edit these lines; every app page picks them up.
vendor: Dmitrii Kartashev
location: Ottawa, Canada
support_email: support@dkartashev.dev

# Per-app settings. Pages in each folder read them as page.<name>.
defaults:
  - scope:
      path: repo-starter
    values:
      layout: default
      slug: repo-starter
      app: "Repo Starter: Templates for Bitbucket"
