.spike{fill:#16130F}.tip{stroke:#16130F;stroke-width:2;stroke-linecap:round}
.grain{fill:#E8B65C}.awn{stroke:#E8B65C;stroke-width:1;stroke-linecap:round}
.note text{font:500 13px "M PLUS 1 Code",ui-monospace,Menlo,Consolas,monospace;fill:#F2ECDF;fill-opacity:.72}
.note .sub{font-size:11.5px;font-weight:400}
.note path{fill:none;stroke:#F2ECDF;stroke-opacity:.72;stroke-width:1}
.note circle{fill:#F2ECDF;fill-opacity:.72}
@media (prefers-color-scheme: dark){.moon{fill:#C9401F}.spike{fill:#0B0A08}.tip{stroke:#0B0A08}.note text,.note circle{fill-opacity:.6}.note path{stroke-opacity:.6}}
</style>
