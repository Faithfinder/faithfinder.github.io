<!-- Narrow band version, without labels. Cattails (gama) and bearded wheat (mugi) before a vermilion sun. Drawn for the indigo panel on projects.dkartashev.dev. -->
<style>
.moon{fill:#E0482A}
.back{opacity:.35}.front{opacity:.92}
.leaf{fill:#F2ECDF}
.stem{fill:none;stroke:#F2ECDF;stroke-width:2.6;stroke-linecap:round}
